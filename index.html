<!DOCTYPE html>
<html lang="es">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORME - Asesoría de Estilo Personal</title>
    <!-- Google Fonts para tipografía elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset y Estilos Generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #faf9f6;
            color: #2c2c2c;
            line-height: 1.6;
        }

        /* Header & Navegación */
        .header {
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            transition: box-shadow 0.3s ease;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Criterio de Aceptación: Etiqueta superior izquierda, gris tenue, tipografía reducida, no clicable */
        .top-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            pointer-events: none; /* Evita cualquier interacción de clic */
            user-select: none;
        }

        .navbar .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .navbar a {
            text-decoration: none;
            color: #444;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .navbar a:hover,
        .navbar a.active {
            color: #b59b75;
        }

        .btn-agenda {
            border: 1px solid #2c2c2c;
            padding: 8px 16px;
            transition: all 0.3s ease;
        }

        .btn-agenda:hover {
            background-color: #2c2c2c;
            color: #fff !important;
        }

        /* Sección Hero */
        .hero {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(rgba(0,0,0,0.03), rgba(0,0,0,0.03)), #faf9f6;
        }

        .hero-content {
            max-width: 700px;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
        }

        .cta-button {
            display: inline-block;
            background-color: #2c2c2c;
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #b59b75;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .navbar .nav-links {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

</body>
</html>
